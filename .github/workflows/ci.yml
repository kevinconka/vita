name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Read-only: nothing here writes to the repo. The artifact upload uses the
    # Actions API, not contents.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # The job runs repo-controlled scripts (pnpm lifecycle hooks, tests,
          # a headless browser). None of them need the workflow token, so do
          # not leave it in the git config for them to find.
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # The browser is installed separately below, with its own cache.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      # Keyed on the lockfile: a Playwright bump invalidates it, nothing else does.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unused files, exports and dependencies
        run: pnpm knip

      # Thresholds live in vitest.config.ts, so a coverage drop fails here
      # rather than waiting on the Codecov status.
      - name: Test with coverage
        run: pnpm coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          # Public repo: uploads work without a token via OIDC. The secret is
          # picked up when set, and its absence must not fail the build.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      # The real end-to-end check: the golden test pins composition, this pins
      # that the theme actually renders and the PDF actually comes out.
      - name: Build ml-lead
        run: pnpm vita build ml-lead

      - name: Check the PDF is non-empty
        run: test -s build/ml-lead/ml-lead.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: ml-lead-cv
          path: |
            build/ml-lead/ml-lead.pdf
            build/ml-lead/index.html
            build/ml-lead/resume.json
          if-no-files-found: error
